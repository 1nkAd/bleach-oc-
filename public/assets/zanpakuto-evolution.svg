<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Connections -->
  <!-- Start to Shikai -->
  <line x1="400" y1="120" x2="400" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Shikai to Incomplete -->
  <line x1="400" y1="220" x2="400" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Incomplete to Yin/Yang -->
  <path d="M 400 320 L 400 340 L 280 340 L 280 360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 320 L 400 340 L 520 340 L 520 360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Yin/Yang to Catalyst -->
  <path d="M 280 420 L 280 440 L 400 440 L 400 460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 520 420 L 520 440 L 400 440 L 400 460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Catalyst to True Bankai -->
  <line x1="400" y1="520" x2="400" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- True Bankai to Techniques -->
  <path d="M 400 620 L 400 640 L 130 640 L 130 680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 620 L 400 640 L 310 640 L 310 680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 620 L 400 640 L 490 640 L 490 680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 620 L 400 640 L 670 640 L 670 680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Masking Rects & Shapes -->
  <!-- Start -->
  <rect x="340" y="80" width="120" height="40" rx="20" fill="#0f172a"/>
  <rect x="340" y="80" width="120" height="40" rx="20" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="400" y="104" fill="white" font-size="12" font-weight="600" text-anchor="middle">Kurokiba</text>

  <!-- Shikai -->
  <rect x="300" y="160" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="160" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="184" fill="white" font-size="12" font-weight="600" text-anchor="middle">Shikai Form</text>
  <text x="400" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">Initial Release</text>
  <text x="400" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">Kinetic Conversion</text>

  <!-- Incomplete Bankai -->
  <rect x="300" y="260" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="260" width="200" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="284" fill="white" font-size="12" font-weight="600" text-anchor="middle">Incomplete Bankai</text>
  <text x="400" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">The False Duality</text>

  <!-- Yin (Hollow) -->
  <rect x="200" y="360" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="200" y="360" width="160" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="280" y="384" fill="white" font-size="11" font-weight="600" text-anchor="middle">Yin (Hollow State)</text>
  <text x="280" y="400" fill="#94a3b8" font-size="9" text-anchor="middle">Hyper-aggressive mobility</text>
  <text x="280" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">Guard-breaking shockwaves</text>

  <!-- Yang (Shinigami) -->
  <rect x="440" y="360" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="440" y="360" width="160" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="520" y="384" fill="white" font-size="11" font-weight="600" text-anchor="middle">Yang (Shinigami State)</text>
  <text x="520" y="400" fill="#94a3b8" font-size="9" text-anchor="middle">Grounded heavy counters</text>
  <text x="520" y="410" fill="#94a3b8" font-size="9" text-anchor="middle">Spatial control</text>

  <!-- Catalyst -->
  <rect x="300" y="460" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="460" width="200" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="484" fill="white" font-size="12" font-weight="600" text-anchor="middle">The Catalyst</text>
  <text x="400" y="500" fill="#fbbf24" font-size="9" text-anchor="middle">Quincy Acknowledgment</text>
  <text x="400" y="510" fill="#94a3b8" font-size="9" text-anchor="middle">Bloodline acts as a fulcrum</text>

  <!-- True Bankai -->
  <rect x="300" y="560" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="560" width="200" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="584" fill="white" font-size="12" font-weight="600" text-anchor="middle">True Bankai</text>
  <text x="400" y="600" fill="#94a3b8" font-size="9" text-anchor="middle">Perfect Equilibrium</text>
  <text x="400" y="610" fill="#94a3b8" font-size="9" text-anchor="middle">Unified Nodachi</text>

  <!-- Techniques -->
  <!-- Equinox Cleave -->
  <rect x="60" y="680" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="60" y="680" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="130" y="704" fill="white" font-size="11" font-weight="600" text-anchor="middle">Equinox Cleave</text>
  <text x="130" y="720" fill="#94a3b8" font-size="8" text-anchor="middle">Dual-property damage</text>

  <!-- Soul Fission -->
  <rect x="240" y="680" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="240" y="680" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="310" y="704" fill="white" font-size="11" font-weight="600" text-anchor="middle">Soul Fission</text>
  <text x="310" y="720" fill="#94a3b8" font-size="8" text-anchor="middle">Forced structural split</text>

  <!-- Nakigara Release -->
  <rect x="420" y="680" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="420" y="680" width="140" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="490" y="704" fill="white" font-size="11" font-weight="600" text-anchor="middle">Nakigara Release</text>
  <text x="490" y="720" fill="#94a3b8" font-size="8" text-anchor="middle">Hollow burst projection</text>

  <!-- Structural Null -->
  <rect x="600" y="680" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="600" y="680" width="140" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="670" y="704" fill="white" font-size="11" font-weight="600" text-anchor="middle">Structural Null</text>
  <text x="670" y="720" fill="#94a3b8" font-size="8" text-anchor="middle">Quincy unmaking</text>

  <!-- Title Block -->
  <text x="30" y="40" fill="white" font-size="16" font-weight="700">Zanpakuto Evolution: Kurokiba</text>
  <text x="30" y="56" fill="#94a3b8" font-size="10">The Path of Duality &amp; Perfect Equilibrium</text>

  <!-- Legend -->
  <rect x="620" y="770" width="150" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="695" y="786" fill="white" font-size="10" font-weight="600" text-anchor="middle">Power Source</text>
  <circle cx="635" cy="800" r="4" fill="#fb7185"/>
  <text x="645" y="803" fill="#94a3b8" font-size="9">Hollow</text>
  <circle cx="695" cy="800" r="4" fill="#22d3ee"/>
  <text x="705" y="803" fill="#94a3b8" font-size="9">Shinigami</text>
  <circle cx="635" cy="814" r="4" fill="#fbbf24"/>
  <text x="645" y="817" fill="#94a3b8" font-size="9">Quincy</text>
  <circle cx="695" cy="814" r="4" fill="#a78bfa"/>
  <text x="705" y="817" fill="#94a3b8" font-size="9">Unified</text>
</svg>
